spring:
  application:
    name: astro-mapa
# no git bash:
# docker run -d -e SPRING_DATASOURCE_URL="jdbc:mysql://host.docker.internal:3306/astro-map?useTimeZone=true&serverTimeZone=UTC" -p 8080:8080 astro-mapa:0.0.1-SNAPSHOT
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://localhost:3306/astro-map?useTimeZone=true&serverTimeZone=UTC
#    username: root
#    password: MyNewPass
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  cors:
    originPatterns: http://localhost:5500,${FRONTEND_URL}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
      show-sql: false
    open-in-view: false

  flyway:
    enabled: true

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG