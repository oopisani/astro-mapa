spring:
  application:
    name: astro-mapa
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/astro-map?useTimeZone=true&serverTimeZone=UTC}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show-sql: false
    open-in-view: false

  flyway:
    enabled: true


cors:
  allowed-origins: "http://localhost:5500,${FRONTEND_URL}"

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG